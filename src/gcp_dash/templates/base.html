<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}gcp-dash{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
<header>
  <strong>gcp-dash</strong>
  <a href="/" class="{{ 'active' if active == 'runtime' else '' }}">Runtime</a>
  <a href="/gcp" class="{{ 'active' if active == 'gcp' else '' }}">GCP</a>
  <span class="muted" style="margin-left:auto">v{{ version }}</span>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
