# Dependabot version updates.
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # Python dependencies: pyproject.toml + uv.lock. The container image installs
  # straight from uv.lock, so these PRs are the only place Python deps change.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  # Base image in the Containerfile. The FROM line is pinned by tag so
  # Dependabot can open a PR whenever Red Hat publishes a new build.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"

  # GitHub Actions workflows (none yet; covered automatically once added).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
