- op: add
  path: /spec/template/spec/containers/-
  value:
    name: ztwim-refresh
    image: ghcr.io/kenmoini/gcp-dash:latest
    imagePullPolicy: Always
    env:
    - name: PROJECT_NUMBER
      valueFrom:
        secretKeyRef:
          name: gcp-dash-config
          key: PROJECT_NUMBER
    - name: WORKLOAD_NAME
      valueFrom:
        secretKeyRef:
          name: gcp-dash-config
          key: WORKLOAD_NAME
    - name: GSA_ID
      valueFrom:
        secretKeyRef:
          name: gcp-dash-config
          key: GSA_ID
    - name: SPIFFE_ENDPOINT_SOCKET
      value: unix:///run/spire/sockets/spire-agent.sock
    volumeMounts:
      - name: gcp-ztwim-swap
        mountPath: /var/run/secrets/gcp
        readOnly: false
      - name: spiffe-workload-api
        mountPath: /run/spire/sockets
        readOnly: true
    command:
      - /bin/sh
      - -c
      - |

        refreshToken() {
          echo "########### Checking expiration..."
          EXPIRATION=$(./decode-jwt.py -f /var/run/secrets/gcp/token -s exp)
          CURRENT_TIME=$(date +%s)
          TIME_LEFT=$((EXPIRATION - CURRENT_TIME))
          echo "########### Time left until expiration: $TIME_LEFT seconds"
          if [ "$TIME_LEFT" -lt 30 ]; then
            echo "########### Refreshing Token..."
            ./get-spiffe-token.py -a https://iam.googleapis.com/projects/$(PROJECT_NUMBER)/locations/global/workloadIdentityPools/$(WORKLOAD_NAME)/providers/$(WORKLOAD_NAME) -o /var/run/secrets/gcp/token
            echo "########### Token Refreshed!"
          else
            echo "########### Token is still valid. No refresh needed."
          fi
        }
        mainExec() {
          while true; do
            sleep 10 # Check every 10 seconds
            refreshToken
          done
        }

        echo "########### Starting Refresh Sidecar..."
        mainExec
