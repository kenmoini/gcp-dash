---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcp-dash
  labels:
    app.kubernetes.io/name: gcp-dash
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gcp-dash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gcp-dash
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: gcp-dash
      initContainers: []
      containers:
        - name: gcp-dash
          image: gcp-dash:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: gcp-dash-config
          env:
            # This are skipped when running on GKE with Workload Identity
            # - name: GOOGLE_APPLICATION_CREDENTIALS
            #   value: /var/secrets/gcp/key.json
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: SERVICE_ACCOUNT
              valueFrom: { fieldRef: { fieldPath: spec.serviceAccountName } }
          volumeMounts: []
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          livenessProbe:
            httpGet: { path: /healthz/live, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /healthz/ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes: []
