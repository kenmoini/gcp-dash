---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gcp-dash-config
data:
  # Set to the GCP project the service account can read.
  # This could be left empty, but for some environments a SA will be created in one project
  # and then given access to other projects, which is why this is a separate variable.
  GCP_PROJECT: ""
  GCP_CACHE_TTL_SECONDS: "60"
  CONTROLS_ENABLED: "true"
  # Root log level for the app itself: DEBUG, INFO, WARNING, ERROR.
  LOG_LEVEL: "INFO"
  # Set to "true" to log every Google API / token request and response, plus tracebacks
  # for failed GCP fetches. Verbose; turn it off again once you have what you need.
  GCP_DEBUG: "false"
