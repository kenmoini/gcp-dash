[project]
name = "gcp-dash"
version = "0.1.0"
description = "Container runtime dashboard with health-probe controls and a GCP resource viewer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "google-auth>=2.30",
    "google-cloud-compute>=1.19",
    "google-cloud-storage>=2.18",
    "google-cloud-resource-manager>=1.12",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gcp_dash"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` as a default argument is the framework's documented
# dependency-injection pattern, not the "mutable default" bug the rule targets.
ignore = ["B008"]
